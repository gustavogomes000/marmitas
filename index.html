<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#521011" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Gestão do dia da D'a Márcia Marmitaria: caixa, vendas, cozinha e entregas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="D'a Márcia" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/marca-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>D'a Márcia Marmitaria — Gestão do Dia</title>
    <style>
      html,
      body {
        margin: 0;
        background-color: #521011;
      }
      #tela-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        overflow: hidden;
        background: radial-gradient(110% 80% at 50% 42%, #681617 0%, #521011 55%, #380809 100%);
      }
      #tela-splash .halo {
        position: absolute;
        width: min(78vw, 340px);
        height: min(78vw, 340px);
        border-radius: 9999px;
        background: radial-gradient(circle, rgba(251, 160, 17, 0.22) 0%, rgba(251, 160, 17, 0) 70%);
        animation: pulsar-halo 2.4s ease-in-out infinite;
        pointer-events: none;
      }
      #tela-splash .logo-wrap {
        position: relative;
        z-index: 2;
        overflow: hidden;
        border-radius: 28px;
        padding: 12px;
        animation: splash-entrar 1.15s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #tela-splash .logo-wrap::after {
        content: "";
        position: absolute;
        inset: -30% auto -30% -150%;
        width: 45%;
        transform: rotate(-18deg);
        background: linear-gradient(90deg, transparent, rgba(255, 244, 218, 0.45), transparent);
        animation: brilho-logo 1.8s ease-in-out 0.45s infinite;
        pointer-events: none;
      }
      #tela-splash img {
        display: block;
        width: min(68vw, 276px);
        height: auto;
        filter: drop-shadow(0 20px 44px rgba(0, 0, 0, 0.52));
      }
      #tela-splash .trilha-vapor {
        position: relative;
        z-index: 2;
        width: min(56vw, 210px);
        height: 5px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.12);
      }
      #tela-splash .vapor {
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #e08a00, #fba011, #ffd07f);
        transform-origin: left center;
        animation: progresso-abertura 2.9s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }
      #tela-splash p {
        position: relative;
        z-index: 2;
        margin: 0;
        font: 600 12.5px/1 system-ui, -apple-system, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(255, 208, 127, 0.9);
        animation: splash-entrar 1s cubic-bezier(0.22, 1, 0.36, 1) 0.25s both;
      }
      @keyframes pulsar-halo {
        0%,
        100% {
          transform: scale(0.94);
          opacity: 0.7;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }
      @keyframes splash-entrar {
        0% {
          opacity: 0;
          transform: translateY(24px) scale(0.84);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @keyframes brilho-logo {
        0% {
          left: -140%;
        }
        65%,
        100% {
          left: 220%;
        }
      }
      @keyframes progresso-abertura {
        0% {
          transform: scaleX(0.06);
        }
        100% {
          transform: scaleX(1);
        }
      }
      @keyframes splash-sair {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        100% {
          opacity: 0;
          transform: scale(1.06);
        }
      }
      #tela-splash.saindo {
        animation: splash-sair 0.65s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="tela-splash">
      <span class="halo"></span>
      <div class="logo-wrap">
        <img src="/logo.png" alt="D'a Márcia Marmitaria" />
      </div>
      <div class="trilha-vapor">
        <span class="vapor"></span>
      </div>
      <p>abrindo a cozinha</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
