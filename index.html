<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#521011" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#521011" />
    <meta name="description" content="Gestão do dia da D'a Márcia Marmitaria: caixa, vendas, cozinha e entregas." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="D'a Márcia" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/pwa-64x64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>D'a Márcia Marmitaria — Gestão do Dia</title>
    <style>
      html,
      body {
        margin: 0;
        background: #521011;
      }
      #tela-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        overflow: hidden;
        background: radial-gradient(130% 85% at 50% -12%, #7a201f 0%, #521011 48%, #320609 100%);
      }
      #tela-splash::before {
        content: "";
        position: absolute;
        top: -96px;
        left: 50%;
        width: 420px;
        height: 420px;
        transform: translateX(-50%);
        border-radius: 9999px;
        background: rgb(251 160 17 / 0.14);
        filter: blur(64px);
        pointer-events: none;
      }
      #tela-splash .logo-wrap {
        position: relative;
        overflow: hidden;
        padding: 8px;
        animation: splash-entrar 0.85s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      #tela-splash .logo-wrap::after {
        content: "";
        position: absolute;
        inset: -30% auto -30% -150%;
        width: 40%;
        transform: rotate(-18deg);
        background: linear-gradient(90deg, transparent, rgba(253, 248, 243, 0.38), transparent);
        animation: brilho-logo 1.3s ease-in-out 0.15s both;
        pointer-events: none;
      }
      #tela-splash img {
        display: block;
        width: min(64vw, 260px);
        height: auto;
        filter: drop-shadow(0 18px 42px rgba(0, 0, 0, 0.48));
      }
      #tela-splash .vapor {
        width: 132px;
        height: 3.5px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, #fba011, transparent);
        animation: vapor-passar 1.3s ease-in-out infinite;
      }
      #tela-splash p {
        margin: 0;
        font: 600 12px/1 system-ui, sans-serif;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgb(251 160 17 / 0.82);
        animation: splash-entrar 0.85s cubic-bezier(0.22, 1, 0.36, 1) 0.12s both;
      }
      @keyframes splash-entrar {
        from {
          opacity: 0;
          transform: translateY(18px) scale(0.92);
          filter: blur(6px);
        }
        to {
          opacity: 1;
          transform: none;
          filter: blur(0);
        }
      }
      @keyframes brilho-logo {
        from {
          left: -140%;
        }
        to {
          left: 220%;
        }
      }
      @keyframes vapor-passar {
        0% {
          opacity: 0.25;
          transform: translateX(-42%);
        }
        50% {
          opacity: 1;
        }
        100% {
          opacity: 0.25;
          transform: translateX(42%);
        }
      }
      @keyframes splash-sair {
        to {
          opacity: 0;
          transform: scale(1.045);
          filter: blur(4px);
        }
      }
      #tela-splash.saindo {
        animation: splash-sair 0.48s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        pointer-events: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #tela-splash .logo-wrap,
        #tela-splash .logo-wrap::after,
        #tela-splash .vapor,
        #tela-splash p {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="tela-splash">
      <div class="logo-wrap">
        <img src="/logo.png" alt="D'a Márcia Marmitaria" />
      </div>
      <span class="vapor"></span>
      <p>abrindo a cozinha</p>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
